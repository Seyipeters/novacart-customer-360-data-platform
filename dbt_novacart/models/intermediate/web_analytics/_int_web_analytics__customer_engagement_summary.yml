version: 2

models:
  - name: int_web_analytics__customer_engagement_summary
    description: >
      Customer-level website engagement summary created from identifiable
      web events. One row represents one customer with at least one recorded
      website interaction.

    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              total_web_events > 0
              and event_type_count > 0

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              campaigns_engaged_count >= 0
              and attributed_order_count >= 0
              and products_engaged_count >= 0
              and pages_visited_count >= 0
              and device_type_count >= 0
              and browser_count >= 0
              and traffic_source_count >= 0

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              event_type_count <= total_web_events
              and campaigns_engaged_count <= total_web_events
              and attributed_order_count <= total_web_events
              and products_engaged_count <= total_web_events
              and pages_visited_count <= total_web_events
              and device_type_count <= total_web_events
              and browser_count <= total_web_events
              and traffic_source_count <= total_web_events

      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_event_at <= latest_event_at"

    columns:
      - name: customer_id
        description: "Unique identifier of the customer represented by the row."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_crm__customers')
                field: customer_id

      - name: total_web_events
        description: "Total number of website events recorded for the customer."
        data_tests:
          - not_null

      - name: event_type_count
        description: "Number of distinct website event types generated by the customer."
        data_tests:
          - not_null

      - name: campaigns_engaged_count
        description: "Number of distinct marketing campaigns connected to the customer."
        data_tests:
          - not_null

      - name: attributed_order_count
        description: "Number of distinct orders connected to the customer's web events."
        data_tests:
          - not_null

      - name: products_engaged_count
        description: "Number of distinct products connected to the customer's web activity."
        data_tests:
          - not_null

      - name: pages_visited_count
        description: "Number of distinct pages visited by the customer."
        data_tests:
          - not_null

      - name: device_type_count
        description: "Number of distinct device types used by the customer."
        data_tests:
          - not_null

      - name: browser_count
        description: "Number of distinct browsers used by the customer."
        data_tests:
          - not_null

      - name: traffic_source_count
        description: "Number of distinct traffic sources connected to the customer."
        data_tests:
          - not_null

      - name: first_event_at
        description: "Timestamp of the customer's earliest recorded web event."
        data_tests:
          - not_null

      - name: latest_event_at
        description: "Timestamp of the customer's most recent recorded web event."
        data_tests:
          - not_null

      - name: latest_source_record_arrived_at
        description: "Latest source-arrival timestamp represented in the summary."
        data_tests:
          - not_null

      - name: latest_loaded_at
        description: "Latest warehouse loading timestamp represented in the summary."
        data_tests:
          - not_null