version: 2

models:
  - name: int_inventory_system__inventory_current
    description: >
      The most recent inventory position for every product and warehouse.
      Historical daily inventory records are ranked by inventory date and
      update timestamp, and only the latest record is retained.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - warehouse_id
              - product_id

    columns:
      - name: inventory_current_id
        description: >
          Surrogate key representing one current product and warehouse
          inventory combination.
        data_tests:
          - not_null
          - unique

      - name: inventory_date
        description: Date represented by the latest inventory record.
        data_tests:
          - not_null

      - name: warehouse_id
        description: Identifier of the warehouse holding the product.
        data_tests:
          - not_null

      - name: product_id
        description: Identifier of the product represented by the inventory record.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_ecommerce__products_current')
                field: product_id

      - name: warehouse_name
        description: Display name of the warehouse.
        data_tests:
          - not_null

      - name: warehouse_city
        description: City where the warehouse is located.
        data_tests:
          - not_null

      - name: warehouse_country
        description: Country where the warehouse is located.
        data_tests:
          - not_null

      - name: opening_stock
        description: Available stock at the beginning of the inventory date.
        data_tests:
          - not_null

      - name: received_quantity
        description: Units received during the inventory date.
        data_tests:
          - not_null

      - name: sold_quantity
        description: Units sold during the inventory date.
        data_tests:
          - not_null

      - name: damaged_quantity
        description: Units removed from stock because of damage.
        data_tests:
          - not_null

      - name: closing_stock
        description: Available stock at the end of the inventory date.
        data_tests:
          - not_null

      - name: unit_cost
        description: Cost assigned to one product unit.
        data_tests:
          - not_null

      - name: inventory_value
        description: Closing inventory quantity multiplied by unit cost.
        data_tests:
          - not_null

      - name: stockout_flag
        description: Indicates whether no stock remains.
        data_tests:
          - not_null

      - name: reorder_flag
        description: Indicates whether the product requires replenishment.
        data_tests:
          - not_null

      - name: source_updated_at
        description: Timestamp when the source inventory record was updated.
        data_tests:
          - not_null

      - name: loaded_at
        description: Timestamp when Snowflake loaded the inventory record.
        data_tests:
          - not_null