version: 2

models:
  - name: fct_customer_engagement
    description: >
      Customer-level aggregate fact containing one row per customer
      with identifiable web engagement activity.

    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              total_web_events >= 0
              and event_type_count >= 0
              and campaigns_engaged_count >= 0
              and attributed_order_count >= 0
              and products_engaged_count >= 0
              and pages_visited_count >= 0

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              device_type_count >= 0
              and browser_count >= 0
              and traffic_source_count >= 0

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              latest_event_at >= first_event_at

    columns:
      - name: customer_key
        description: "Warehouse key connecting engagement activity to dim_customers."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: customer_id
        description: "Source-system customer identifier."
        data_tests:
          - not_null
          - unique

      - name: total_web_events
        description: "Total identifiable web events generated by the customer."
        data_tests:
          - not_null

      - name: campaigns_engaged_count
        description: "Number of distinct campaigns the customer engaged with."
        data_tests:
          - not_null

      - name: attributed_order_count
        description: "Number of orders attributed to the customer's web activity."
        data_tests:
          - not_null

      - name: products_engaged_count
        description: "Number of distinct products associated with customer engagement."
        data_tests:
          - not_null

      - name: pages_visited_count
        description: "Number of distinct pages visited by the customer."
        data_tests:
          - not_null

      - name: first_event_at
        description: "Timestamp of the customer's earliest identifiable web event."
        data_tests:
          - not_null

      - name: latest_event_at
        description: "Timestamp of the customer's latest identifiable web event."
        data_tests:
          - not_null