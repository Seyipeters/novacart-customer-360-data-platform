version: 2

models:
  - name: stg_ecommerce__products
    description: |
      Cleaned and standardized product data from the raw ecommerce source. 
      This staging model applies consistent formatting, type casting, and transformations 
      to product attributes while preserving traceability to the original source records.
      
      Key transformations applied:
      - Text fields (product_id, sku, product_name, category, brand) are trimmed and uppercased for consistency
      - Financial amounts are cast to fixed-point decimal (18,2) to prevent rounding errors
      - A unique source record identifier is generated via SHA-256 hashing
      - All source metadata is preserved for lineage and debugging
    
    columns:
      - name: product_source_record_id
        description: |
          Unique SHA-256 hash identifier for the exact source record. Generated from the 
          combination of source_file_content_key and source_file_row_number to ensure 
          stable deduplication across loads and enable tracking of record changes.
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: |
          Business identifier for the product. Trimmed and normalized for consistency 
          across the data platform.
        data_tests:
          - not_null
          - unique
          

      - name: sku
        description: |
          Stock keeping unit - the unique merchandise identifier used in inventory and 
          sales operations. Uppercased and trimmed for standardization.
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: |
          Human-readable product name. Trimmed to remove leading/trailing whitespace.
        data_tests:
          - not_null

      - name: category
        description: |
          Primary product category. Uppercased for consistent grouping and filtering 
          across analytics and reporting.
        data_tests:
          - not_null
          

      - name: subcategory
        description: |
          Secondary product classification within the primary category. Uppercased 
          for consistency.
        data_tests:
          - not_null

      - name: brand
        description: |
          Product manufacturer or brand name. Uppercased for consistent reporting 
          and brand analysis.
        data_tests:
          - not_null

      - name: unit_cost
        description: |
          The cost to acquire or manufacture one unit of this product. 
          Stored as a decimal with two decimal places (cents precision).
        data_type: number
        data_tests:
          - not_null
          

      - name: list_price
        description: |
          The recommended or list selling price for one unit. 
          Stored as a decimal with two decimal places (cents precision).
        data_type: number
        data_tests:
          - not_null
       

      - name: is_active
        description: |
          Boolean flag indicating whether the product is currently available for sale. 
          TRUE = active product, FALSE = discontinued or inactive.
        data_tests:
          - not_null
        

      - name: launch_date
        description: |
          The date the product was first made available for sale.
        data_type: date
        data_tests:
          - not_null
         

      - name: source_updated_at
        description: |
          The timestamp when the product record was last updated in the source system.
        data_type: timestamp
        data_tests:
          - not_null

      - name: source_file
        description: |
          Name or path of the source file from which this record was extracted. 
          Used for debugging and tracing data lineage.
        data_tests:
          - not_null

      - name: source_file_row_number
        description: |
          The row number of this record within the source file. Used as part of the 
          composite key for generating product_source_record_id.
        data_tests:
          - not_null

      - name: source_file_content_key
        description: |
          A content-based identifier from the source file. Used as part of the 
          composite key for generating product_source_record_id to ensure stable deduplication.
        data_tests:
          - not_null

      - name: source_file_last_modified
        description: |
          The timestamp when the source file was last updated. Used to track 
          data freshness and identify recent changes.
        data_type: timestamp
        data_tests:
          - not_null

      - name: loaded_at
        description: |
          The timestamp when this record was loaded into the data warehouse. 
          Indicates when the data became available for analytics.
        data_type: timestamp
        data_tests:
          - not_null

  - name: stg_ecommerce__orders
    description: |
      Cleaned and standardized order data from the raw ecommerce source. 
      This staging model applies consistent formatting, type casting, and transformations 
      to order attributes while preserving traceability to the original source records.
      
      Key transformations applied:
      - Text fields (order_id, customer_id, product_id) are trimmed and uppercased for consistency
      - Financial amounts are cast to fixed-point decimal (18,2) to prevent rounding errors
      - A unique source record identifier is generated via SHA-256 hashing
      - All source metadata is preserved for lineage and debugging
    
    columns:
      - name: order_source_record_id
        description: |
          Unique SHA-256 hash identifier for the exact source record. Generated from the 
          combination of source_file_content_key and source_file_row_number to ensure 
          stable deduplication across loads and enable tracking of record changes.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: |
          Business identifier for the order. Trimmed and normalized for consistency 
          across the data platform.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: |
          Business identifier for the customer who placed the order. Trimmed and normalized 
          for consistency across the data platform.
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_crm__customers')
                field: customer_id

      - name: order_timestamp
        description: |
          The timestamp when the order was placed. Used for time-based analysis and reporting.
        data_type: timestamp
        data_tests:
          - not_null
         

      - name: order_date
        description: |
          The date when the order was placed. Derived from order_timestamp for date-based analysis.
        data_type: date
        data_tests:
          - not_null

      - name: order_status
        description: |
          The current status of the order (e.g., PROCESSING, SHIPPED, COMPLETED, CANCELLED). 
          Uppercased for consistent reporting.
        data_tests:
          - not_null

      - name: sales_channel
        description: |
          The sales channel through which the order was placed (e.g., WEB, MARKETINGPLACE, MOBILE_APP). 
          Uppercased for consistent reporting.
        data_tests:
          - not_null

      - name: shipping_city
        description: Destination city for the order.
        data_tests:
          - not_null

      - name: shipping_country
        description: Destination country for the order.
        data_tests:
          - not_null

      - name: currency
        description: Currency used for the order amounts.
        data_tests:
          - not_null

      - name: item_count
        description: Number of separate product lines in the order.
        data_tests:
          - not_null

      - name: total_quantity
        description: Total number of units included in the order.
        data_tests:
          - not_null

      - name: subtotal_amount
        description: Total value before discounts and shipping.
        data_tests:
          - not_null

      - name: discount_amount
        description: Discount deducted from the order subtotal.
        data_tests:
          - not_null

      - name: shipping_amount
        description: Shipping fee applied to the order.
        data_tests:
          - not_null

      - name: order_total
        description: Final order amount after discounts and shipping.
        data_tests:
          - not_null

      - name: source_updated_at
        description: Timestamp when the source order was last updated.
        data_tests:
          - not_null

      - name: source_file
        description: S3 object from which the order record was loaded.
        data_tests:
          - not_null

      - name: source_file_row_number
        description: Original row number in the source CSV file.
        data_tests:
          - not_null

      - name: loaded_at
        description: Timestamp when Snowflake loaded the record.
        data_tests:
          - not_null

  - name: stg_ecommerce__order_items
    description: |
      Cleaned and standardized order item data from the raw ecommerce source. 
      This staging model applies consistent formatting, type casting, and transformations 
      to order item attributes while preserving traceability to the original source records.
      
      Key transformations applied:
      - Text fields (order_id, product_id) are trimmed and uppercased for consistency
      - Financial amounts are cast to fixed-point decimal (18,2) to prevent rounding errors
      - A unique source record identifier is generated via SHA-256 hashing
      - All source metadata is preserved for lineage and debugging
    
    columns:
      - name: order_item_source_record_id
        description: |
          Unique SHA-256 hash identifier for the exact source record. Generated from the 
          combination of source_file_content_key and source_file_row_number to ensure 
          stable deduplication across loads and enable tracking of record changes.
        data_tests:
          - not_null
          - unique

      - name: order_item_id
        description: |
          Business identifier for the order item. Trimmed and normalized for consistency 
          across the data platform.
        data_tests:
          - not_null

      - name: order_id
        description: |
          Business identifier for the order associated with this item. Trimmed and normalized 
          for consistency across the data platform.
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_ecommerce__orders')
                field: order_id

      - name: product_id
        description: |
          Business identifier for the product included in this order item. Trimmed and normalized 
          for consistency across the data platform.
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_ecommerce__products')
                field: product_id

      - name: quantity
        description: Number of units of the product in this order item.
        data_tests:
          - not_null

      - name: unit_price
        description: Price per unit of the product in this order item.
        data_tests:
          - not_null

      - name: gross_amount
        description: Total amount for this order item before discounts.
        data_tests:
          - not_null

      - name: discount_rate
        description: Discount rate applied to this order item.
        data_tests:
          - not_null

      - name: discount_amount
        description: Total discount amount applied to this order item.
        data_tests:
          - not_null

      - name: net_amount
        description: Total amount for this order item after discounts.
        data_tests:
          - not_null

      - name: source_created_at
        description: Timestamp when the order item record was created in the source system.
        data_tests:
          - not_null

      - name: source_file_row_number
        description: Original row number in the source CSV file for this order item.
        data_tests:
          - not_null

      - name: source_file_last_modified
        description: Timestamp when the source file containing this order item was last modified.
        data_tests:
          - not_null

      - name: loaded_at
        description: Timestamp when Snowflake loaded the order item record.
        data_tests:
          - not_null      
