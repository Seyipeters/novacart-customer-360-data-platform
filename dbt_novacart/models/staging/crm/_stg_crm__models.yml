version: 2

models:
  - name: stg_crm__customers
    description: >
      Cleaned and standardized CRM customer records. The model preserves
      one row per source customer record and retains ingestion metadata.

    columns:
      - name: customer_source_record_id
        description: >
          Technical source-record identifier generated from the file
          content key and file row number.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer business identifier from the CRM system.
        data_tests:
          - not_null
          - unique

      - name: first_name
        description: Customer first name with surrounding spaces removed.

      - name: last_name
        description: Customer last name with surrounding spaces removed.

      - name: email
        description: Customer email standardized to lowercase.
        data_tests:
          - not_null

      - name: registration_date
        description: Date on which the customer registered.
        data_tests:
          - not_null

      - name: loyalty_status
        description: Customer loyalty level standardized to uppercase.

      - name: acquisition_channel
        description: Acquisition channel standardized to uppercase.

      - name: is_active
        description: Indicates whether the CRM customer is active.
        data_tests:
          - not_null

      - name: source_updated_at
        description: Timestamp of the latest update in the CRM source.
        data_tests:
          - not_null

      - name: source_file
        description: S3 file from which the record originated.
        data_tests:
          - not_null

      - name: source_file_row_number
        description: Original row number inside the source CSV.
        data_tests:
          - not_null

      - name: loaded_at
        description: Timestamp when Snowflake loaded the record.
        data_tests:
          - not_null
